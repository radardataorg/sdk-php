# ============================================================================
# CI/CD do radardata/sdk-php.
#
# O GitLab e DESENVOLVIMENTO e e privado. O GitHub e a vitrine publica, e e de
# lá que o Packagist lê. Esse desenho existe porque o grupo radardata.com.br é
# privado no GitLab, e no GitLab um projeto não pode ser mais visível que o
# grupo dele.
#
#   tag vX.Y.Z  →  testa  →  espelha no GitHub  →  avisa o Packagist
#
# A ordem não é estética: o Packagist vai LER o GitHub. Avisar antes de a tag
# estar lá faz ele não achar nada e registrar nada.
#
# Variáveis (Settings → CI/CD → Variables):
#   GITHUB_DEPLOY_KEY_B64  chave privada (base64) da deploy key do repositório no
#                      GitHub. Deploy key e não PAT: ela tem escrita em UM
#                      repositório só, não expira e não alcança mais nada da
#                      conta. PAT, mesmo restrito, expira e falha calado meses
#                      depois. Guardada em base64 para poder ir MASKED, que o
#                      GitLab não faz com valor de várias linhas.
#   GITHUB_REPO        `owner/repo` no GitHub, ex.: radardataorg/sdk-php
#   PACKAGIST_USUARIO  o usuário do Packagist
#   PACKAGIST_TOKEN    API token do Packagist (masked). Profile → Show API Token
#
# As variáveis estão PROTECTED, e variável protegida só existe em tag
# protegida: a tag `v*` está protegida neste projeto, e sem isso o job falharia
# dizendo que a variável não existe.
#
# O primeiro envio ao Packagist é manual e uma vez só: packagist.org → Submit,
# apontando para a url do GITHUB (não a do GitLab, que é privada).
# ============================================================================
stages: [test, espelhar, publicar]

default:
  image: php:8.2-cli-alpine
  before_script:
    - apk add --no-cache git unzip $PHPIZE_DEPS >/dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --prefer-dist --no-interaction --no-progress

teste:
  stage: test
  script:
    - vendor/bin/pint --test
    - vendor/bin/phpunit
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

espelhar-no-github:
  stage: espelhar
  image: alpine:3.20
  variables:
    # Clone COMPLETO. O padrão do GitLab é raso, e repositório raso não se
    # empurra: o push é recusado com "shallow update not allowed".
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git openssh-client >/dev/null
  script:
    - |
      test -n "$GITHUB_DEPLOY_KEY_B64" || { echo "ERRO: GITHUB_DEPLOY_KEY_B64 nao configurado."; exit 1; }
      test -n "$GITHUB_REPO" || { echo "ERRO: GITHUB_REPO nao configurado (owner/repo)."; exit 1; }
    - |
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      echo "$GITHUB_DEPLOY_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        # Empurra `main` e a tag, e NADA MAIS. De propósito: o GitLab é privado e
    # pode ter branch de experimento; espelhar tudo publicaria trabalho que
    # ninguém decidiu publicar. Aqui o que vira público é explícito.
    - git fetch origin main --quiet
    - git push "git@github.com:${GITHUB_REPO}.git" "origin/main:refs/heads/main"
    - git push "git@github.com:${GITHUB_REPO}.git" "refs/tags/${CI_COMMIT_TAG}"
    - echo "Espelhado em https://github.com/${GITHUB_REPO} na tag ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG'

# O Packagist lê a tag do git, então não há `version` no composer.json para
# conferir. O que vale conferir é que a tag é semver de verdade: uma tag
# `v1.1` ou `teste` entraria no catálogo como versão esquisita e não dá para
# apagar depois.
publicar-no-packagist:
  stage: publicar
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl >/dev/null
  script:
    - |
      echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
        echo "ERRO: a tag '$CI_COMMIT_TAG' não é semver (esperado vX.Y.Z)."
        echo "Versão publicada no Packagist não se apaga, então o job para aqui."
        exit 1
      }
    - |
      test -n "$PACKAGIST_TOKEN" || { echo "ERRO: PACKAGIST_TOKEN não configurado."; exit 1; }
      test -n "$PACKAGIST_USUARIO" || { echo "ERRO: PACKAGIST_USUARIO não configurado."; exit 1; }
      test -n "$GITHUB_REPO" || { echo "ERRO: GITHUB_REPO não configurado."; exit 1; }
    - |
      # O Packagist vai LER o GitHub e achar a tag nova sozinho. Este POST só o
      # acorda; sem ele a tag demora, ou não aparece se não houver webhook.
      alvo="https://github.com/${GITHUB_REPO}"
      resposta=$(curl -sS -w '\n%{http_code}' -X POST \
        "https://packagist.org/api/update-package?username=${PACKAGIST_USUARIO}&apiToken=${PACKAGIST_TOKEN}" \
        -H 'Content-Type: application/json' \
        -d "{\"repository\":{\"url\":\"${alvo}\"}}")
      corpo=$(echo "$resposta" | head -n -1)
      codigo=$(echo "$resposta" | tail -n 1)
      echo "Packagist respondeu $codigo: $corpo"
      test "$codigo" = "202" || test "$codigo" = "200" || exit 1
    - echo "Avisado o Packagist sobre $CI_COMMIT_TAG. Confira em https://packagist.org/packages/radardata/sdk-php"
  rules:
    - if: '$CI_COMMIT_TAG'
